[env:az-delivery-devkit-v4]
platform = espressif32
board =esp32dev  # az-delivery-devkit-v4  esp32-s3-devkitc-1
framework = arduino

lib_extra_dirs = 
	CAN-Library/MART_CAN/lib

upload_port = COM6

